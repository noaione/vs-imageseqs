[package]
name = "vs-imageseqs"
version = "0.2.1"
edition = "2024"
authors = ["noaione <noaione@n4o.xyz>"]
license = "MPL-2.0"
readme = "./README.md"
keywords = ["vapoursynth", "image-reader"]
description = "Rust-based image sequences reader for VapourSynth"
repository = "https://github.com/noaione/vs-imageseqs"
homepage = "https://github.com/noaione/vs-imageseqs"
rust-version = "1.94.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The decompressors are named rather than inherited, so what this reader can
# read is visible here: `deflate`, `fax`, `jpeg` and `lzw` are the crate's
# defaults and `zstd` is not one of them. `webp`, its last feature, is left out
# because a tiff is never a webp.
tiff = { version = "0.11.3", default-features = false, features = [
    "deflate",
    "fax",
    "jpeg",
    "lzw",
    "zstd",
] }
vapoursynth4-rs = { version = "0.5.1", default-features = false, features = [
    "vs-42", # >=R74
    "vsscript-43" # >=R79
] }

# image stuff
image = { version = "0.25.10", default-features = false, features = [
    # formats
    "avif-native",
    # other
    "rayon"
] }
# `jpeg` is deliberately not one of the features above. `image`'s own jpeg
# decoder *is* `zune-jpeg`, which this tree depends on directly for
# `src/formats/jpeg.rs`, so enabling it here would put a second adapter in
# front of the same decoder: a jpeg this tree declines, `image` declines too.
# The `jpeg` in the `tiff` features earlier is a different flag and is needed --
# a tiff strip can hold a jpeg -- so this is not a claim that jpeg is unused.
# `gif` is not one either: a one frame gif is read by `src/formats/gif.rs`, which
# composes the canvas the animation path already composes with.
# `webp` is not one either: the probe is `src/formats/webp.rs`'s own container
# walk, the decode is libwebp's, and the only file `image`'s webp reader was
# still reached for -- an animated webp whose name hid the animation from the
# probe -- is now read from the timeline by `animation/webp.rs`.
# openexr is read here rather than by `image`, whose adapter decodes into an
# f32 image of its own and then copies its bytes to the generic buffer; see
# `src/formats/exr.rs`
exr = "1.74.2"
libheif-rs = { version = "3.0.0", default-features = false, features = [
    # `image` is deliberately not enabled: this tree reads every heif and avif
    # through this crate's own API, and the integration that taught `image` to
    # read one was the last thing that needed it.
    "v1_23", # target libheif v1.23.x
    "embedded-libheif" # build on linux (v1.23.0)
] }
jxl = { version = "0.7.4", default-features = false, features = [
    "all-simd" # the same vector paths the image integration enabled
] }
# the av1 decoder `image` already links for avif, used directly so that the
# planes the bitstream holds are handed out instead of r,g,b; see
# `docs/improvements/12-heif-avif-yuv-output.md`
dav1d = { version = "0.11.1", default-features = false }
jpeg2k = { version = "0.10.1", default-features = false, features = [
    "openjpeg-sys"
] }
# animated png is composed here rather than by `image`, whose APNG compositor
# refuses every 16-bit colour type; see `src/animation/apng.rs`
png = { version = "0.18.1", default-features = false }
# a jpeg is decoded here rather than by `image`, whose reader parses the file's
# headers four times for one probe and one decode, and whose EXIF and ICC
# accessors each rebuild it; see `src/formats/jpeg.rs`. `zune-core` is the
# colorspace and options type the two crates share, and it is named directly so
# that a decoder is built by this module's own options rather than a default.
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
# animated gif is composed here rather than by `image`, whose compositor is
# the one this replaces and whose frame iterator decodes every picture to find
# the timeline; see `src/animation/gif.rs`
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# quite ok image is read here rather than by `image`, whose qoi adapter parses
# the header a second time for every accessor; see `src/formats/qoi.rs`
qoi = { version = "0.4.1", default-features = false, features = ["std"] }

# native stuff: find libwebp, see build.rs
[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2.15"

[target.'cfg(not(windows))'.build-dependencies]
pkg-config = "0.3.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
incremental = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
