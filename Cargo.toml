[package]
name = "vs-imageseqs"
version = "0.2.1"
edition = "2024"
authors = ["noaione <noaione@n4o.xyz>"]
license = "MPL-2.0"
readme = "./README.md"
keywords = ["vapoursynth", "image-reader"]
description = "Rust-based image sequences reader for VapourSynth"
repository = "https://github.com/noaione/vs-imageseqs"
homepage = "https://github.com/noaione/vs-imageseqs"
rust-version = "1.94.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The decompressors are named rather than inherited, so what this reader can
# read is visible here: `deflate`, `fax`, `jpeg` and `lzw` are the crate's
# defaults.
tiff = { version = "0.11.3", default-features = false, features = [
    "deflate",
    "fax",
    "jpeg",
    "lzw",
] }
vapoursynth4-rs = { version = "0.5.1", default-features = false, features = [
    "vs-42", # >=R74
    "vsscript-43" # >=R79
] }

# openexr is read here, whose adapter decodes into an f32 image of its own and
# then copies its bytes to the generic buffer; see `src/formats/exr.rs`
exr = "1.74.2"
libheif-rs = { version = "3.0.0", default-features = false, features = [
    "v1_23", # target libheif v1.23.x
    "embedded-libheif" # build on linux (v1.23.0)
] }
jxl = { version = "0.7.4", default-features = false, features = [
    "all-simd"
] }
dav1d = { version = "0.11.1", default-features = false }
jpeg2k = { version = "0.10.1", default-features = false, features = [
    "openjpeg-sys"
] }
png = { version = "0.18.1", default-features = false }
# a jpeg is decoder, whose reader parses the file's headers four times
# for one probe and one decode, and whose EXIF and ICC accessors each rebuild
# it; see `src/formats/jpeg.rs`. `zune-core` is the colorspace and options
# type the two crates share, and it is named directly so that a decoder is
# built by this module's own options rather than a default.
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
# animated gif is composed here, whose compositor is the one this replaces and whose
# frame iterator decodes every picture to find the timeline; see `src/animation/gif.rs`
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# quite ok image is read here, whose qoi adapter parses the header a second
# time for every accessor; see `src/formats/qoi.rs`
qoi = { version = "0.4.1", default-features = false, features = ["std"] }

# native stuff: find libwebp, see build.rs
[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2.15"

[target.'cfg(not(windows))'.build-dependencies]
pkg-config = "0.3.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
incremental = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
