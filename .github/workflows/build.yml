name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-26.04
          - name: macos-arm64
            os: macos-26
          - name: windows-x86_64
            os: windows-2025

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: set up msvc
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build pkg-config libdav1d-dev libde265-dev

      - name: install macos dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config dav1d libde265

      - name: install windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = 'C:\vcpkg'
          }

          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg was not found at $vcpkg"
          }

          $installRoot = Join-Path $workspace 'vcpkg_installed'
          & $vcpkg install `
            --triplet x64-windows-static-md `
            --x-manifest-root=$workspace `
            --x-install-root=$installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

          # pkgconf is a build-time tool used by dav1d-sys on Windows.
          & $vcpkg install pkgconf:x64-windows --classic --x-install-root=$installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg pkgconf install failed with exit code $LASTEXITCODE"
          }

          # libheif-sys uses vcpkg-rs, while dav1d-sys discovers dav1d with
          # pkg-config. The adapter keeps both crates on the same local tree.
          $adapter = Join-Path $workspace 'target\vcpkg-root'
          $installed = $installRoot
          New-Item -ItemType Directory -Force -Path $adapter | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $adapter '.vcpkg-root') | Out-Null
          New-Item -ItemType Junction -Force `
            -Path (Join-Path $adapter 'installed') `
            -Target $installed | Out-Null

          $pkgconf = Join-Path $installed 'x64-windows\tools\pkgconf'
          $pkgconfExecutable = Join-Path $pkgconf 'pkgconf.exe'
          if (-not (Test-Path -LiteralPath $pkgconfExecutable)) {
            throw "pkgconf was not found at $pkgconfExecutable"
          }
          $pkgconf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          @(
            "VCPKG_ROOT=$adapter"
            'VCPKGRS_TRIPLET=x64-windows-static-md'
            "PKG_CONFIG=$pkgconfExecutable"
            "PKG_CONFIG_PATH=$(Join-Path $installed 'x64-windows-static-md\lib\pkgconfig')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: install build tools
        run: python -m pip install --upgrade pip build

      - name: run rust tests
        run: cargo test --locked

      - name: build wheel
        run: python -m build --wheel --outdir dist

      - name: upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    name: source distribution
    runs-on: ubuntu-26.04
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install build tools
        run: python -m pip install --upgrade pip build

      - name: build source distribution
        run: python -m build --sdist --outdir dist

      - name: upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
