name: build

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'

env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/rust-tests.yml

  linux-wheel:
    name: linux-x86_64 (manylinux)
    runs-on: ubuntu-26.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
    defaults:
      run:
        shell: bash
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: install assembler
        run: dnf install --assumeyes nasm

      - name: build and repair Linux wheel
        run: bash tools/build-manylinux.sh

      - name: upload repaired wheel
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: upload standalone plugin and bundled libraries
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-plugins
          path: native/**
          if-no-files-found: error

      - name: upload Linux relinking sources
        uses: actions/upload-artifact@v7
        with:
          name: linux-relink-source
          path: source-bundle/*.tar.gz
          if-no-files-found: error

  linux-validation:
    name: validate Linux distribution without build dependencies
    needs: linux-wheel
    runs-on: ubuntu-26.04
    # A fresh baseline container has neither our native prefix nor its loader
    # paths. Test the published layouts, not target/release from the builder.
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
    defaults:
      run:
        shell: bash
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: download repaired wheel
        uses: actions/download-artifact@v7
        with:
          name: linux-x86_64-wheels
          path: dist

      - name: download standalone plugin
        uses: actions/download-artifact@v7
        with:
          name: linux-x86_64-plugins
          path: native

      - name: validate wheel and standalone plugin
        run: |
          set -euo pipefail
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python tools/check-linux-wheel.py dist
          auditwheel show dist/*.whl
          python -m pip install --no-deps dist/*.whl
          env -u LD_LIBRARY_PATH python tests/check-autoload.py
          installed_plugin=$(python -c 'import vapoursynth as vs; print(vs.get_plugin_dir() + "/imageseqs/libvs_imageseqs.so")')
          for plugin in "$installed_plugin" "$PWD/native/imageseqs/libvs_imageseqs.so"; do
            env -u LD_LIBRARY_PATH python -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$plugin"
            env -u LD_LIBRARY_PATH IMGSEQS_PLUGIN="$plugin" python tests/readalpha.vpy
          done

  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
          - name: windows-x86_64
            os: windows-2025

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: set up msvc
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: install macos dependencies
        if: runner.os == 'macOS'
        run: brew install cmake meson ninja pkg-config webp

      - name: build pinned macOS codec libraries
        if: runner.os == 'macOS'
        run: |
          bash tools/build-macos-native.sh
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/target/macos-native/prefix/lib/pkgconfig:/opt/homebrew/opt/webp/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/target/macos-native/prefix" >> "$GITHUB_ENV"
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: prepare vcpkg cache directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed') | Out-Null

      - name: cache vcpkg dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Windows'
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-

      - name: install windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = 'C:\vcpkg'
          }

          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg was not found at $vcpkg"
          }

          $installRoot = Join-Path $workspace 'vcpkg_installed'
          & $vcpkg install `
            --triplet x64-windows-static-md `
            --x-manifest-root=$workspace `
            --x-install-root=$installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

          # pkgconf is a build-time tool used by dav1d-sys on Windows.
          & $vcpkg install pkgconf:x64-windows --classic --x-install-root=$installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg pkgconf install failed with exit code $LASTEXITCODE"
          }

          # libheif-sys uses vcpkg-rs, while dav1d-sys discovers dav1d with
          # pkg-config. The adapter keeps both crates on the same local tree.
          $adapter = Join-Path $workspace 'target\vcpkg-root'
          $installed = $installRoot
          New-Item -ItemType Directory -Force -Path $adapter | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $adapter '.vcpkg-root') | Out-Null
          # A restored Rust target cache can contain a stale file or junction
          # at this path. Remove it before creating the adapter junction.
          $adapterInstalled = Join-Path $adapter 'installed'
          $existingAdapterInstalled = Get-Item -LiteralPath $adapterInstalled -Force -ErrorAction SilentlyContinue
          if ($null -ne $existingAdapterInstalled) {
            Remove-Item -LiteralPath $adapterInstalled -Force -Recurse
          }
          New-Item -ItemType Junction -Force `
            -Path $adapterInstalled `
            -Target $installed | Out-Null

          $pkgconf = Join-Path $installed 'x64-windows\tools\pkgconf'
          $pkgconfExecutable = Join-Path $pkgconf 'pkgconf.exe'
          if (-not (Test-Path -LiteralPath $pkgconfExecutable)) {
            throw "pkgconf was not found at $pkgconfExecutable"
          }
          $pkgconf | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          @(
            "VCPKG_ROOT=$adapter"
            'VCPKGRS_TRIPLET=x64-windows-static-md'
            "PKG_CONFIG=$pkgconfExecutable"
            "PKG_CONFIG_PATH=$(Join-Path $installed 'x64-windows-static-md\lib\pkgconfig')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: install build tools
        run: python -m pip install --upgrade pip build

      - name: install macOS wheel repair tool
        if: runner.os == 'macOS'
        run: python -m pip install delocate==0.13.0

      - name: clear the previous build output
        run: python tools/build_output.py clear dist

      - name: clear cached libheif configuration
        if: runner.os == 'macOS'
        run: cargo clean --release --package libheif-sys

      - name: build wheel
        run: python -m build --wheel --outdir dist
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: bundle macOS runtime libraries
        if: runner.os == 'macOS'
        run: python tools/package-macos-wheel.py dist
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: check the unix plugin links libwebp statically
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              plugin=target/release/libvs_imageseqs.so
              dependencies=$(readelf -d "$plugin")
              ;;
            macOS)
              plugin=target/release/libvs_imageseqs.dylib
              dependencies=$(otool -L "$plugin")
              ;;
            *)
              echo "unsupported runner: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          if echo "$dependencies" | grep -E 'libwebp|libsharpyuv'; then
            echo "the plugin still needs libwebp from the system at run time" >&2
            exit 1
          fi
          echo "libwebp is linked into the plugin"

      - name: stage native plugin from wheel
        run: python tools/stage-native.py dist native

      - name: validate installed plugin manifest
        run: |
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('dist').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)"
          python tests/check-autoload.py

      - name: upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: upload native plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-plugins
          path: native/**
          if-no-files-found: error

  macos-validation:
    name: validate macOS distribution on a clean runner
    needs: wheels
    runs-on: macos-15
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: download macOS wheel
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-wheels
          path: dist

      - name: download standalone plugin
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-plugins
          path: native

      - name: install VapourSynth and wheel
        run: |
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python -m pip install --no-deps dist/*.whl

      - name: validate installed wheel and relocated plugin bundle
        run: |
          set -euo pipefail
          env -u DYLD_LIBRARY_PATH python tests/check-autoload.py
          env -u DYLD_LIBRARY_PATH IMGSEQS_PLUGIN="$PWD/native/imageseqs/libvs_imageseqs.dylib" python tests/readalpha.vpy

  source:
    name: source distribution and packaging tools
    runs-on: ubuntu-26.04
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install build tools
        run: python -m pip install --upgrade pip build

      - name: check the packaging tools
        run: python tests/check-packaging-tools.py

      - name: clear the previous build output
        run: python tools/build_output.py clear dist

      - name: build source distribution
        run: python -m build --sdist --outdir dist

      - name: check the source distribution has the build inputs
        run: |
          sdist=$(ls dist/*.tar.gz)
          echo "checking $sdist"
          for file in \
            build.rs Cargo.toml Cargo.lock vcpkg.json hatch_build.py \
            pyproject.toml CHANGELOG.md tools/build-macos-native.sh \
            tools/macos-libheif-toolchain.cmake tools/package-macos-wheel.py; do
            tar -tzf "$sdist" | grep -Eq "/${file}\$" || {
              echo "missing ${file} in $sdist"
              exit 1
            }
          done
          tar -tzf "$sdist" | grep -Eq '/src/.*\.rs$' || {
            echo "missing the rust sources in $sdist"
            exit 1
          }

      - name: upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - linux-validation
      - macos-validation
      - wheels
      - source
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/vapoursynth-imageseqs
    permissions:
      contents: read
      id-token: write

    steps:
      - name: download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: '*-wheels'
          path: dist
          merge-multiple: true

      - name: download source distribution
        uses: actions/download-artifact@v7
        with:
          name: source-distribution
          path: dist

      - name: list distributions
        run: ls -la dist

      - name: publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - linux-validation
      - macos-validation
      - wheels
      - source
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*'
          path: artifacts

      - name: prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;

          for platform in linux-x86_64 macos-arm64 windows-x86_64; do
            plugin_dir="artifacts/${platform}-plugins"
            test -f "$plugin_dir/LICENSE"
            bundle="release-assets/${platform}-plugin"
            mkdir -p "$bundle"
            # Preserve the manifest and bundled codecs inside imageseqs/.
            cp -a "$plugin_dir/." "$bundle/"
            (
              cd release-assets
              zip -qr "${platform}-plugin.zip" "${platform}-plugin"
            )
            rm -rf "$bundle"
          done

          find release-assets -maxdepth 1 -type f -print | sort

      - name: attest release assets
        uses: actions/attest@v4
        id: attest
        with:
          subject-path: 'release-assets/*'

      - name: create changelog
        id: prepare-change
        run: |
          # Strict by default: the tag, pyproject.toml, Cargo.toml and the
          # changelog have to agree, so a release cannot be published with
          # placeholder notes or a version the tree does not state.
          python tools/create-changelog.py
          # Fetch git tag contents subject
          VERSION_SUBJ=$(git tag -l --format='%(contents:subject)' ${{ github.ref }})
          echo "version_subject=$VERSION_SUBJ" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ github.ref }}
          ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            -F CHANGELOG-GENERATED.md
