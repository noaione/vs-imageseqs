name: build

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'

env:
  CARGO_TERM_COLOR: always
  IMGSEQS_RUST_TOOLCHAIN: "1.99.0"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/rust-tests.yml

  linux-wheel:
    name: linux-x86_64 (manylinux)
    runs-on: ubuntu-26.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
    defaults:
      run:
        shell: bash
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.IMGSEQS_RUST_TOOLCHAIN }}

      - name: cache Python build downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: manylinux-pip-v1-${{ hashFiles('tools/setup-linux-build.sh', '.github/workflows/build.yml') }}

      - name: prepare Linux build environment
        id: setup
        run: sh tools/setup-linux-build.sh
        env:
          IMGSEQS_LINUX_PLATFORM: manylinux
          IMGSEQS_WRITE_GITHUB_ENV: "1"

      - name: cache native codec libraries
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/manylinux/prefix
            target/manylinux/archives
          key: ${{ steps.setup.outputs.native-key }}

      - name: cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/manylinux/cargo"
          key: ${{ steps.setup.outputs.native-key }}
          env-vars: "CARGO CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CMAKE RUST PKG_CONFIG LD_LIBRARY_PATH"

      - name: build and repair Linux wheel
        run: bash tools/build-manylinux.sh
        env:
          IMGSEQS_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: upload repaired wheel
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: upload standalone plugin and bundled libraries
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-plugins
          path: native/**
          if-no-files-found: error

      - name: upload Linux relinking sources
        uses: actions/upload-artifact@v7
        with:
          name: linux-relink-source
          path: source-bundle/*.tar.gz
          if-no-files-found: error

  linux-validation:
    name: validate Linux distribution without build dependencies
    needs: linux-wheel
    runs-on: ubuntu-26.04
    # A fresh baseline container has neither our native prefix nor its loader
    # paths. Test the published layouts, not target/release from the builder.
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
    defaults:
      run:
        shell: bash
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: download repaired wheel
        uses: actions/download-artifact@v7
        with:
          name: linux-x86_64-wheels
          path: dist

      - name: download standalone plugin
        uses: actions/download-artifact@v7
        with:
          name: linux-x86_64-plugins
          path: native

      - name: validate wheel and standalone plugin
        run: |
          set -euo pipefail
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python tools/check-linux-wheel.py dist
          auditwheel show dist/*.whl
          python -m pip install --no-deps dist/*.whl
          env -u LD_LIBRARY_PATH python tests/check-autoload.py
          installed_plugin=$(python -c 'import vapoursynth as vs; print(vs.get_plugin_dir() + "/imageseqs/libvs_imageseqs.so")')
          for plugin in "$installed_plugin" "$PWD/native/imageseqs/libvs_imageseqs.so"; do
            env -u LD_LIBRARY_PATH python -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$plugin"
            env -u LD_LIBRARY_PATH IMGSEQS_PLUGIN="$plugin" python tests/readalpha.vpy
          done

  linux-musl-wheel:
    name: linux-x86_64 (musllinux)
    runs-on: ubuntu-26.04
    # The musl counterpart of the manylinux job above, from the Alpine-based
    # image of the same policy. Setup runs before the compiled dependency cache
    # so its key sees the musl toolchain and the same environment as the build.
    container: quay.io/pypa/musllinux_1_2_x86_64@sha256:ff786af69d772d7ac3e318c00a2b682428a352cc822d6175f6a0d4b431c0d44d
    defaults:
      run:
        shell: sh
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: cache musl Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/env
          key: musllinux-rustup-v1-${{ env.IMGSEQS_RUST_TOOLCHAIN }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: cache Python build downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: musllinux-pip-v1-${{ hashFiles('tools/setup-linux-build.sh', '.github/workflows/build.yml') }}

      - name: prepare Linux build environment
        id: setup
        run: sh tools/setup-linux-build.sh
        env:
          IMGSEQS_LINUX_PLATFORM: musllinux
          IMGSEQS_WRITE_GITHUB_ENV: "1"

      - name: cache native codec libraries
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/musllinux/prefix
            target/musllinux/archives
          key: ${{ steps.setup.outputs.native-key }}

      - name: cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/musllinux/cargo"
          key: ${{ steps.setup.outputs.native-key }}
          env-vars: "CARGO CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CMAKE RUST PKG_CONFIG LD_LIBRARY_PATH"

      - name: build and repair musllinux wheel
        run: sh tools/build-musllinux.sh
        env:
          IMGSEQS_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}

      - name: upload repaired wheel
        uses: actions/upload-artifact@v7
        with:
          name: linux-musl-x86_64-wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: upload standalone plugin and bundled libraries
        uses: actions/upload-artifact@v7
        with:
          name: linux-musl-x86_64-plugins
          path: native/**
          if-no-files-found: error

      - name: upload Linux relinking sources
        uses: actions/upload-artifact@v7
        with:
          name: linux-musl-relink-source
          path: source-bundle/*.tar.gz
          if-no-files-found: error

  linux-musl-validation:
    name: validate musllinux distribution without build dependencies
    needs: linux-musl-wheel
    runs-on: ubuntu-26.04
    # A fresh copy of that image: it holds neither the native prefix nor the
    # loader paths the builder used, so this validates the published layouts.
    container: quay.io/pypa/musllinux_1_2_x86_64@sha256:ff786af69d772d7ac3e318c00a2b682428a352cc822d6175f6a0d4b431c0d44d
    defaults:
      run:
        shell: sh
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: download repaired wheel
        uses: actions/download-artifact@v7
        with:
          name: linux-musl-x86_64-wheels
          path: dist

      - name: download standalone plugin
        uses: actions/download-artifact@v7
        with:
          name: linux-musl-x86_64-plugins
          path: native

      - name: validate wheel and standalone plugin
        run: |
          set -eu
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python tools/check-linux-wheel.py \
            --tag py3-none-musllinux_1_2_x86_64 \
            --allow-library libstdc++ \
            --allow-library libgcc_s \
            dist
          auditwheel show dist/*.whl
          python -m pip install --no-deps dist/*.whl
          env -u LD_LIBRARY_PATH python tests/check-autoload.py
          installed_plugin=$(python -c 'import vapoursynth as vs; print(vs.get_plugin_dir() + "/imageseqs/libvs_imageseqs.so")')
          for plugin in "$installed_plugin" "$PWD/native/imageseqs/libvs_imageseqs.so"; do
            env -u LD_LIBRARY_PATH python -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$plugin"
            env -u LD_LIBRARY_PATH IMGSEQS_PLUGIN="$plugin" python tests/readalpha.vpy
          done

  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
          - name: windows-x86_64
            os: windows-2025

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.IMGSEQS_RUST_TOOLCHAIN }}

      - name: install NASM assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$nasmDirectory;$env:PATH"
          nasm -v

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: set up msvc
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: install macos dependencies
        if: runner.os == 'macOS'
        run: brew install cmake meson ninja pkg-config

      - name: build pinned macOS codec libraries
        if: runner.os == 'macOS'
        run: |
          bash tools/build-macos-native.sh
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/target/macos-native/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/target/macos-native/prefix" >> "$GITHUB_ENV"
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: prepare vcpkg cache directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed') | Out-Null

      - name: cache vcpkg dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Windows'
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'tools/vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-

      - name: build Windows wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-windows.ps1 -InstallRoot "$env:GITHUB_WORKSPACE\vcpkg_installed" -OutputDirectory dist

      - name: install build tools
        if: runner.os == 'macOS'
        run: python -m pip install --upgrade pip build

      - name: install macOS wheel repair tool
        if: runner.os == 'macOS'
        run: python -m pip install delocate==0.13.0

      - name: clear the previous build output
        if: runner.os == 'macOS'
        run: python tools/build_output.py clear dist

      - name: clear cached libheif configuration
        if: runner.os == 'macOS'
        run: cargo clean --release --package libheif-sys

      - name: build wheel
        if: runner.os == 'macOS'
        run: python -m build --wheel --outdir dist
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: bundle macOS runtime libraries
        if: runner.os == 'macOS'
        run: python tools/package-macos-wheel.py dist
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: check the unix plugin links no webp library
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              plugin=target/release/libvs_imageseqs.so
              dependencies=$(readelf -d "$plugin")
              ;;
            macOS)
              plugin=target/release/libvs_imageseqs.dylib
              dependencies=$(otool -L "$plugin")
              ;;
            *)
              echo "unsupported runner: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          if echo "$dependencies" | grep -E 'libwebp|libsharpyuv'; then
            echo "the plugin still links a webp library, which nothing decodes with any more" >&2
            exit 1
          fi
          echo "no webp library is linked"

      - name: stage native plugin from wheel
        run: python tools/stage-native.py dist native

      - name: validate installed plugin manifest
        run: |
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('dist').glob('*.whl'); subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)"
          python tests/check-autoload.py

      - name: upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: upload native plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-plugins
          path: native/**
          if-no-files-found: error

  macos-validation:
    name: validate macOS distribution on a clean runner
    needs: wheels
    runs-on: macos-15
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: download macOS wheel
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-wheels
          path: dist

      - name: download standalone plugin
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-plugins
          path: native

      - name: install VapourSynth and wheel
        run: |
          python -m pip install --only-binary=:all: "VapourSynth==79"
          python -m pip install --no-deps dist/*.whl

      - name: validate installed wheel and relocated plugin bundle
        run: |
          set -euo pipefail
          env -u DYLD_LIBRARY_PATH python tests/check-autoload.py
          env -u DYLD_LIBRARY_PATH IMGSEQS_PLUGIN="$PWD/native/imageseqs/libvs_imageseqs.dylib" python tests/readalpha.vpy

  source:
    name: source distribution and packaging tools
    runs-on: ubuntu-26.04
    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install build tools
        run: python -m pip install --upgrade pip build

      - name: check the packaging tools
        run: python tests/check-packaging-tools.py

      - name: clear the previous build output
        run: python tools/build_output.py clear dist

      - name: build source distribution
        run: python -m build --sdist --outdir dist

      - name: check the source distribution has the build inputs
        run: |
          sdist=$(ls dist/*.tar.gz)
          echo "checking $sdist"
          for file in \
            build.rs Cargo.toml Cargo.lock vcpkg.json hatch_build.py \
            pyproject.toml CHANGELOG.md tools/build-macos-native.sh \
            tools/build-manylinux.sh tools/build-musllinux.sh \
            tools/setup-linux-build.sh tools/linux-native-cache.py \
            tools/make-linux-source-bundle.sh \
            tools/macos-libheif-toolchain.cmake tools/package-macos-wheel.py \
            tools/vcpkg-ports/libheif/vcpkg.json \
            tools/vcpkg-ports/libheif/portfile.cmake; do
            tar -tzf "$sdist" | grep -Eq "/${file}\$" || {
              echo "missing ${file} in $sdist"
              exit 1
            }
          done
          tar -tzf "$sdist" | grep -Eq '/src/.*\.rs$' || {
            echo "missing the rust sources in $sdist"
            exit 1
          }

      - name: upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - linux-validation
      - linux-musl-validation
      - macos-validation
      - wheels
      - source
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/vapoursynth-imageseqs
    permissions:
      contents: read
      id-token: write

    steps:
      - name: download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: '*-wheels'
          path: dist
          merge-multiple: true

      - name: download source distribution
        uses: actions/download-artifact@v7
        with:
          name: source-distribution
          path: dist

      - name: list distributions
        run: ls -la dist

      - name: publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - linux-validation
      - linux-musl-validation
      - macos-validation
      - wheels
      - source
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*'
          path: artifacts

      - name: prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;

          for platform in linux-x86_64 linux-musl-x86_64 macos-arm64 windows-x86_64; do
            plugin_dir="artifacts/${platform}-plugins"
            test -f "$plugin_dir/LICENSE"
            bundle="release-assets/${platform}-plugin"
            mkdir -p "$bundle"
            # Preserve the manifest and bundled codecs inside imageseqs/.
            cp -a "$plugin_dir/." "$bundle/"
            (
              cd release-assets
              zip -qr "${platform}-plugin.zip" "${platform}-plugin"
            )
            rm -rf "$bundle"
          done

          find release-assets -maxdepth 1 -type f -print | sort

      - name: attest release assets
        uses: actions/attest@v4
        id: attest
        with:
          subject-path: 'release-assets/*'

      - name: create changelog
        id: prepare-change
        run: |
          # Strict by default: the tag, pyproject.toml, Cargo.toml and the
          # changelog have to agree, so a release cannot be published with
          # placeholder notes or a version the tree does not state.
          python tools/create-changelog.py
          # Fetch git tag contents subject
          VERSION_SUBJ=$(git tag -l --format='%(contents:subject)' ${{ github.ref }})
          echo "version_subject=$VERSION_SUBJ" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ github.ref }}
          ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            -F CHANGELOG-GENERATED.md
