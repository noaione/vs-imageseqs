name: rust tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-26.04

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: install native dependencies
        run: |
          sudo apt-get update
          # nasm assembles wpd's x86-64 decode routines; without it its build
          # script fails before the crate is compiled.
          sudo apt-get install --yes cmake ninja-build pkg-config nasm libdav1d-dev libde265-dev libwebp-dev

      - name: run rust tests
        run: cargo test --locked

      - name: run clippy and format
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check

      - name: install VapourSynth
        run: python -m pip install "VapourSynth>=79,<81"

      - name: build release plugin
        run: cargo build --release --locked

      - name: run VapourSynth validation
        run: python tests/readalpha.vpy
