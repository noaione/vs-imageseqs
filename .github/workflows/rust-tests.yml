name: rust tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Use the same optional-codec policy when building the pinned system libheif
  # for tests and when building the Linux wheels.
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/manylinux-toolchain.cmake

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-26.04

    steps:
      - name: check out source
        uses: actions/checkout@v7

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2

      # libheif-sys records pkg-config's link configuration and does not treat
      # the installed native library as an input. Clear both profiles before
      # linking against the pinned 1.23.5 build.
      - name: clear the cached libheif configuration
        run: |
          cargo clean --package libheif-sys
          cargo clean --release --package libheif-sys

      - name: install native dependencies
        run: |
          sudo apt-get update
          # nasm assembles wpd's x86-64 decode routines; without it its build
          # script fails before the crate is compiled.
          sudo apt-get install --yes cmake ninja-build pkg-config nasm libdav1d-dev libde265-dev
          . tools/libheif-pin.sh
          native="$GITHUB_WORKSPACE/target/rust-test-native"
          mkdir -p "$native/archives" "$native/sources/libheif-$LIBHEIF_VERSION"
          curl --fail --location --retry 3 \
            "$LIBHEIF_SOURCE_URL" \
            --output "$native/archives/libheif-$LIBHEIF_VERSION.tar.gz"
          printf '%s  %s\n' "$LIBHEIF_SHA512" \
            "$native/archives/libheif-$LIBHEIF_VERSION.tar.gz" | sha512sum --check
          tar -xzf "$native/archives/libheif-$LIBHEIF_VERSION.tar.gz" \
            --strip-components=1 -C "$native/sources/libheif-$LIBHEIF_VERSION"
          export PKG_CONFIG_PATH="$native/prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export CMAKE_PREFIX_PATH="$native/prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          export LD_LIBRARY_PATH="$native/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash tools/build-libheif.sh \
            "$native/sources/libheif-$LIBHEIF_VERSION" "$native/libheif-build" "$native/prefix"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: run rust tests
        run: cargo test --locked

      - name: run clippy and format
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check

      - name: install VapourSynth
        run: python -m pip install "VapourSynth>=79,<81"

      - name: build release plugin
        run: cargo build --release --locked

      - name: run VapourSynth validation
        run: python tests/readalpha.vpy
