[project]
name = "vapoursynth-imageseqs"
version = "0.2.1"
description = "A native VapourSynth source plugin for ordered image sequences"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }
authors = [
    { name = "noaione", email = "noaione@n4o.xyz" },
]
keywords = [
    "vapoursynth",
    "image-sequence",
    "image-reader",
    "video-processing",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/noaione/vs-imageseqs"
Repository = "https://github.com/noaione/vs-imageseqs"
Issues = "https://github.com/noaione/vs-imageseqs/issues"
Changelog = "https://github.com/noaione/vs-imageseqs/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "packaging>=26.3",
    "delocate>=0.13.0",
    "VapourSynth>=79",
    "vsrepo>=2.0"
]
dev-bench = [
    "Pillow>=12.0",
    "natsort>=8.4.0",
    "vapoursynth-bestsource>=22",
]

[build-system]
requires = ["hatchling>=1.27", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/imageseqs/**",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "vcpkg.json",
    "src/**/*.rs",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "docs/**/*.md",
    "tools/build-manylinux.sh",
    "tools/build-musllinux.sh",
    "tools/setup-linux-build.sh",
    "tools/linux-native-cache.py",
    "tools/build-windows.ps1",
    "tools/make-linux-source-bundle.sh",
    "tools/build_output.py",
    "tools/check-linux-wheel.py",
    "tools/create-changelog.py",
    "tools/package-linux-wheel.py",
    "tools/package-macos-wheel.py",
    "tools/build-macos-native.sh",
    "tools/macos-libheif-toolchain.cmake",
    "tools/stage-native.py",
    "tools/manylinux-toolchain.cmake",
    "tools/vcpkg-ports/libheif/**",
    "LICENSE",
    "THIRD_PARTY_NOTICES",
    "LICENSES/**",
]
